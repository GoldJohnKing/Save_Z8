<?xml version="1.0" encoding="UTF-8"?>
<!--
  Save Z8 应用图标 · 小尺寸简化稿（适用 16/24/32px）
  细节阈值法：主稿六弦线在小尺寸下会糊成噪点，仅保留 1/3/5 号弦线
  （Feather aperture 六弦为六重旋转对称，隔根取三 → 120° 三叶片，读作快门）；
  描边加粗至 3.0（24 单位制）× scale 34 = 102px，16px 下约 1.6px 实线；
  母题微放大（×34，104..920）补偿小尺寸视觉缩水。

  圆、弦线路径数据仍取自 MainWindow.axaml 资源 Icon.Aperture 的对应子路径，未手绘。

  渲染示例：cairosvg app-icon-small.svg -o icon_16.png （配合 output-width / output-height 指定边长）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img">
  <title>Save Z8</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2990FF"/>
      <stop offset="1" stop-color="#135CB8"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="268" fill="url(#plate)"/>

  <!-- 圆环（完整保留）+ 隔根三弦线（1/3/5 号子路径，120° 对称） -->
  <g transform="translate(104 104) scale(34)"
     fill="none" stroke="#FFFFFF" stroke-width="3"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 12a10 10 0 1 0 20 0a10 10 0 1 0-20 0"/>
    <path d="M14.31 8l5.74 9.94"/>
    <path d="M7.38 12l5.74-9.94"/>
    <path d="M14.31 16H2.83"/>
  </g>
</svg>
